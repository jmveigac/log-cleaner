name: CI and Windows package

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14.6"
  PYTHONUTF8: "1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  build-windows:
    name: Build Windows EXE
    needs: [check, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Build executable
        run: pyinstaller --clean --noconfirm log-cleaner.spec
      - name: Add version to executable filename
        shell: pwsh
        run: |
          $version = python -c "from log_cleaner.version import __version__; print(__version__)"
          Move-Item "dist/log-cleaner.exe" "dist/log-cleaner-v$version-windows-x64.exe"
          Get-Item "dist/log-cleaner-v$version-windows-x64.exe"
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: log-cleaner-windows-x64
          path: dist/log-cleaner-v*-windows-x64.exe
          if-no-files-found: error
          retention-days: 30
