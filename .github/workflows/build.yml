name: CI, Windows package and release

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14.6"
  PYTHONUTF8: "1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  build-windows:
    name: Build Windows EXE
    needs: [check, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Build executable
        run: pyinstaller --clean --noconfirm log-cleaner.spec
      - name: Add version to executable filename
        shell: pwsh
        run: |
          $version = python -c "from log_cleaner.version import __version__; print(__version__)"
          Move-Item "dist/log-cleaner.exe" "dist/log-cleaner-v$version-windows-x64.exe"
          Get-Item "dist/log-cleaner-v$version-windows-x64.exe"
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: log-cleaner-windows-x64
          path: dist/log-cleaner-v*-windows-x64.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v8
        with:
          name: log-cleaner-windows-x64
          path: release
      - name: Resolve application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          asset="$(find release -maxdepth 1 -type f -name 'log-cleaner-v*-windows-x64.exe' -print -quit)"
          if [ -z "$asset" ]; then
            echo "::error::Versioned Windows executable was not found."
            exit 1
          fi

          filename="$(basename "$asset")"
          version="${filename#log-cleaner-v}"
          version="${version%-windows-x64.exe}"
          tag="v${version}"

          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish release when version is new
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.version.outputs.asset }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping publication."
            exit 0
          fi

          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Log Cleaner $TAG" \
            --generate-notes
