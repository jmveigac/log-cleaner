name: Build diagnostics

on:
  push:
    branches:
      - agent/refresh-log-cleaner

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
          architecture: x64
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Capture PyInstaller output
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm log-cleaner.spec *> build-output.txt
          exit 0
      - name: Commit diagnostics
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output.txt
          git commit -m "Capture Windows build diagnostics"
          git push
